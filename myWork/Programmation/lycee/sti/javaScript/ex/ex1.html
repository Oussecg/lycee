<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="" alt="" id="resultImg"/>
    <figure>
      <img src="image1.png" alt="image1" id="image1"/>
      <img src="image2.png" alt="image2" id="image2"/>
      <img src="image3.png" alt="image3" id="image3"/>
    </figure>
    <script>
      let src = ""
      document.getElementById("image1").addEventListener("click", () => {
        src = "image.png"
      })

      document.getElementsById("image2").addEventListener("click", () => {
        src = "image2.png"
      })

      document.getElementsById("image3").addEventListener("click", () => {
        src = "image3.png"
      })

      document.getElementById("resultImg").src = src;
    </script>
  </body>
</html>
