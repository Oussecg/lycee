<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="mesStyles.css">
    <script src="mesControles.js"></script>
</head>
<body>
    <h2>Contactez-nous</h2>
    <fieldset>
        <legend>Envoyer un message</legend>
        <form action="">
            <div>
                <label for="contactNom">Nom:</label>
                <input type="text" id="contactNom">
            </div>

            <div>
                <label for="contactEmail">Email:</label>
                <input type="email" id="contactEmail">
            </div>

            <div>
                <label for="contactMessage">Message:</label>
                <textarea id="contactMessage"></textarea>
            </div>

            <input type="submit" value="Envoyer" id="contactEnvoyer" class="formButton" onclick="return Contact();">
        </form>
    </fieldset>
</body>
</html>
