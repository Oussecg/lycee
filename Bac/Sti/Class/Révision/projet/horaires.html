<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Horaires</h2>
    <hr>
    <table border="1px">
        <caption>Les activités de la semaine</caption>
        <tr>
            <th>Jour</th>
            <th>8 à 10</th>
            <th>10 à 12</th>
            <th>12 à 14</th>
            <th>14 à 16</th>
        </tr>

        <tr>
            <td>Lundi</td>
            <td>coran</td>
            <td>Dessin</td>
            <td rowspan="2">Déjeuner</td>
            <td>Pizzle</td>
        </tr>

        <tr>
            <td>Mardi</td>
            <td>Sport</td>
            <td>Arabe</td>
            <td>Français</td>
        </tr>

        <tr>
            <td>Mercredi</td>
            <td colspan="4">Repos</td>
        </tr>

        <tr>
            <td>jeudi</td>
            <td colspan="2">Lecture</td>
            <td colspan="2" rowspan="2"></td>
        </tr>

        <tr>
            <td>Vendredi</td>
            <td>coran</td>
            <td>mathématique</td>
        </tr>
    </table>
</body>
</html>
