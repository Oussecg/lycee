<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        do{
            var x = Number(prompt("X= "))
        } while (! (x >= 10))

        let ch = String(x)
        let p1 = ch.charAt(0)
        let p2 = ch.substring(1, ch.length - 1)
        let p3 = ch.charAt(ch.length - 1)
        ch = p3 + p2 + p1
        document.write("X= " + ch);
    </script>
</head>
<body>
    
</body>
</html>
