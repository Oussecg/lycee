<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force d'un mot de passe</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset>
        <legend>Niveau de force d'un mon de passe</legend>
        <div>
            <label for="">Mot de passe</label>
            <input type="text" name="" id="mp" onkeyup="Force();">
        </div>
        <p>Force du mot de passe: <output id="out"></output></p>
    </fieldset>
</body>
</html>
