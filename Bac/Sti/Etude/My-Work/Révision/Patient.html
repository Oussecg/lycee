<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Patient</title>
		<link rel="stylesheet" href="mesStyles.css" />
		<script src="mesControles.js"></script>
	</head>
	<body onload="IdPatient();">
		<form action="">
			<fieldset>
				<legend>Information personnels</legend>

				<div>
					<label for="IdPatient">Identifiant Patient:</label>
					<input type="text" name="" id="IdPatient" readonly />
				</div>

				<div>
					<label for="Nom">Nom:</label>
					<input type="text" name="" id="Nom" />
				</div>

				<div>
					<label for="Prenom">Prénom:</label>
					<input type="text" id="Prenom" />
				</div>

				<div>
					<label for="dateNaissance">Date de naissance:</label>
					<input type="date" id="dateNaissance" />
				</div>

				<div>
					<label for="">Sexe:</label>
					<div style="display: inline-block">
						<input type="radio" name="sex" value="H" id="H" />Homme
						<input type="radio" name="sex" value="F" id="F" />Femme
					</div>
				</div>

				<div>
					<label for="tel">Téléphone:</label>
					<input type="number" id="tel" required/>
				</div>

				<div>
					<label for="email">Email:</label>
					<input type="email" id="email" required/>
				</div>
			</fieldset>

			<fieldset>
				<legend>Informations médicales</legend>

				<div>
					<label for="groupSanguine">Groupe Sanguin:</label>
					<select name="" id="groupSanguine">
						<option value="">Choisir votre groupe sanguin</option>
						<option value="A+">A+</option>
						<option value="A-">A-</option>
						<option value="B+">B+</option>
						<option value="B-">B-</option>
						<option value="AB+">AB+</option>
						<option value="AB-">AB-</option>
						<option value="O+">O+</option>
						<option value="O-">O-</option>
					</select>
				</div>

				<div>
					<label for="antecedantMedical">Antécédent Médical:</label
					><textarea
						name=""
						id="antecedantMedical"
						row="5"
						maxlength="150"
					></textarea>
				</div>
			</fieldset>

			<div>
				<input type="submit" value="Enregistrer" class="formButtons" onclick="return Patient();"/>
				<input type="reset" value="Effacer" class="formButtons" />
			</div>
		</form>
	</body>
</html>
