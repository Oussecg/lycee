<body id="abonnement">
    <form method="" onsubmit="return verif2();">

                    <td>Code Client :</td> <td> <input type="text" id="cdc" name="cdc" /></td>

                </tr>
                <tr>

                    <td>
                        <select name="" id="Ta" onchange="Prix();">

                            <option value="150">Complet</option>
                            <option value="200">Extra</option>
                        </select>
                    </td>
                </tr>
                    <td><input type="submit" value="S'abonner" /><span> </span><input type="reset" value="Annuler" /></td> <td></td>
                </tr>

            </table>
            <output id="out">Prix: ...DT</output>
        </fieldset>
    </form>

</section>
